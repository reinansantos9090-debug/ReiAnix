name: ReiAnix Python Regression (legacy compatibility)

# PR regression gate; release_certification.yml repeats the suite and broader audit after changes reach main.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: python-regression-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression:
    name: Python source and compatibility regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source revision
        shell: bash
        env:
          REIANIX_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REIANIX_SOURCE_SHA"
          git diff --check

      - name: Configure Python for regression tests only
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Validate Python source syntax
        run: python -m compileall -q main.py app_config.py core views scripts

      - name: Run Python regression suite
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q | tee pytest.txt

      - name: Check repository whitespace
        run: git diff --check
