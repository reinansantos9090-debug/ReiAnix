name: ReiAnix Release Evidence Certification

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: reianix-release-certification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-certification:
    name: Native Kotlin compilation certification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout official repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Validate native entry point and repository integrity
        shell: bash
        run: |
          set -euo pipefail
          test -s android/settings.gradle.kts
          test -s android/build.gradle.kts
          test -s android/app/build.gradle.kts
          test -s android/app/src/main/AndroidManifest.xml
          test -s android/app/src/main/kotlin/com/reiflix/reiflix_local/MainActivity.kt
          test -s android/app/src/main/kotlin/com/reiflix/reiflix_local/ReiAnixApplication.kt
          test ! -e main.py
          test -n "$(find android/app/src/main/kotlin -type f -name '*.kt' -print -quit)"
          grep -Fq 'android:name=".MainActivity"' android/app/src/main/AndroidManifest.xml
          git diff --check
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Run JVM SQLite regression tests and compile release Kotlin sources
        shell: bash
        env:
          GRADLE_OPTS: "-Dorg.gradle.caching=true -Dorg.gradle.parallel=true -Dorg.gradle.workers.max=2"
        run: |
          set -euo pipefail
          contract="$RUNNER_TEMP/native-sqlite-contract-v29.json"
          fixture="android/app/src/test/resources/native-sqlite-schema-v29.json"
          mkdir -p "$(dirname "$fixture")"
          trap 'rm -f "$fixture"; rmdir "$(dirname "$fixture")" 2>/dev/null || true' EXIT
          gzip -dc android/app/src/main/assets/native-sqlite-contract-v29.json.gz > "$contract"
          jq '. + {statements: ((.table_sql | to_entries | sort_by(.key) | map(.value)) + ([.indexes | sort_by(.name)[] | select(.sql != null) | .sql]))}' "$contract" > "$fixture"
          jq -e '.schema_version == 29 and (.tables | length == 14) and (.statements | length >= 14)' "$fixture" >/dev/null
          gradle -p android --no-daemon --console=plain --stacktrace --max-workers=2 \
            -PreianixBuildNumber="$GITHUB_RUN_NUMBER" \
            -PreianixBuildVersion="0.2.1" \
            :app:testDebugUnitTest \
            :app:compileReleaseKotlin 2>&1 | tee "$RUNNER_TEMP/reianix-jvm-certification.log"

      - name: Upload JVM certification log for failure diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ReiAnix-JVM-certification-log-${{ github.run_number }}
          path: ${{ runner.temp }}/reianix-jvm-certification.log
          retention-days: 7
          if-no-files-found: warn
