name: ReiAnix Native Gradle APK Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: native-gradle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-apk:
    name: Native Gradle APK (no legacy toolchain)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Configure Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configure Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;36.0.0 platforms;android-36'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Validate wrapper and source revision
        shell: bash
        env:
          REIANIX_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REIANIX_SOURCE_SHA"
          echo "REIANIX_SOURCE_SHA=$REIANIX_SOURCE_SHA" >> "$GITHUB_ENV"
          test -s gradlew
          test -s gradle/wrapper/gradle-wrapper.jar
          test -s gradle/wrapper/gradle-wrapper.properties
          test -s settings.gradle.kts
          test -s android/app/build.gradle.kts
          test -s build-logic/native-sqlite-contract-v29.json.gz.b64
          chmod +x gradlew
          ./gradlew --version

      - name: Clean native app outputs
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:clean --no-daemon --stacktrace

      - name: Assemble native debug APK
        shell: bash
        env:
          GRADLE_OPTS: "-Dorg.gradle.parallel=false -Dorg.gradle.workers.max=2"
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace --max-workers=2
          test "$(git rev-parse HEAD)" = "$REIANIX_SOURCE_SHA"

      - name: Verify APK metadata and native payload
        shell: bash
        run: |
          set -euo pipefail
          source_apk="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$source_apk"
          unzip -tq "$source_apk"

          # Verify the actual APK entries; Gradle success alone does not prove
          # that a native package excludes the legacy runtime payload.
          apk_entries="$(unzip -Z1 "$source_apk")"
          legacy_payload_pattern='(^|/)assets/app\.zip$|^assets/flutter_assets/|^lib/[^/]+/lib(app|[^/]*(flutter|python)[^/]*)\.so$|(^|/)[^/]+\.py[co]?$'
          if grep -Eiq "$legacy_payload_pattern" <<< "$apk_entries"; then
            echo "::error::Native APK contains a legacy Python/Flet/Flutter runtime payload."
            grep -Ei "$legacy_payload_pattern" <<< "$apk_entries"
            exit 1
          fi
          apk_tool="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$apk_tool"
          mkdir -p build/native-gradle-distribution
          "$apk_tool" dump badging "$source_apk" > build/native-gradle-distribution/apk-badging.txt
          "$apk_tool" dump xmltree "$source_apk" AndroidManifest.xml > build/native-gradle-distribution/effective-manifest.txt
          grep -F "package: name='com.reiflix.reiflix_local'" build/native-gradle-distribution/apk-badging.txt
          grep -F "sdkVersion:'24'" build/native-gradle-distribution/apk-badging.txt
          grep -F "targetSdkVersion:'36'" build/native-gradle-distribution/apk-badging.txt
          grep -F 'com.reiflix.reiflix_local.MainActivity' build/native-gradle-distribution/effective-manifest.txt
          grep -F 'com.reiflix.reiflix_local.NativePlayerActivity' build/native-gradle-distribution/effective-manifest.txt
          if grep -Eiq 'io\.flutter\.embedding|Flutter(Activity|FragmentActivity)|com\.flet' build/native-gradle-distribution/effective-manifest.txt; then
            echo "::error::The native APK manifest still declares a legacy Flutter/Flet activity."
            exit 1
          fi
          unzip -Z1 "$source_apk" | grep -Fx 'assets/native-sqlite-contract-v29.json'
          unzip -Z1 "$source_apk" | grep -Fx 'assets/native-sqlite-bootstrap-v29.json'
          unzip -Z1 "$source_apk" | grep -Eq '^classes([0-9]+)?\.dex$'
          while IFS= read -r dex; do
            unzip -p "$source_apk" "$dex"
          done < <(unzip -Z1 "$source_apk" | grep -E '^classes([0-9]+)?\.dex$') | strings > build/native-gradle-distribution/dex-strings.txt
          grep -F 'Lcom/reiflix/reiflix_local/MainActivity;' build/native-gradle-distribution/dex-strings.txt
          grep -F 'Lcom/reiflix/reiflix_local/ui/host/ReiAnixComposeLibraryHost;' build/native-gradle-distribution/dex-strings.txt
          grep -F 'Lcom/reiflix/reiflix_local/NativePlayerActivity;' build/native-gradle-distribution/dex-strings.txt
          cp "$source_apk" build/native-gradle-distribution/ReiAnix-native-debug.apk
          test -s build/native-gradle-distribution/ReiAnix-native-debug.apk

      - name: Create ZIP, build manifest, and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          distribution="build/native-gradle-distribution"
          version_code="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$distribution/ReiAnix-native-debug.apk" | sed -nE "s/^package:.*versionCode='([0-9]+)'.*/\\1/p" | head -n1)"
          version_name="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$distribution/ReiAnix-native-debug.apk" | sed -nE "s/^package:.*versionName='([^']+)'.*/\\1/p" | head -n1)"
          test -n "$version_code"
          test -n "$version_name"
          (
            cd "$distribution"
            sha256sum ReiAnix-native-debug.apk > ReiAnix-native-debug.apk.sha256
          )
          {
            printf '{\n'
            printf '  "app": "ReiAnix",\n'
            printf '  "applicationId": "com.reiflix.reiflix_local",\n'
            printf '  "variant": "debug",\n'
            printf '  "versionCode": %s,\n' "$version_code"
            printf '  "versionName": "%s",\n' "$version_name"
            printf '  "commit": "%s",\n' "$REIANIX_SOURCE_SHA"
            printf '  "artifactPurpose": "native-gradle-validation",\n'
            printf '  "pythonRuntimePackaged": false,\n'
            printf '  "fletRuntimePackaged": false,\n'
            printf '  "flutterRuntimePackaged": false,\n'
            printf '  "runtimeIndependenceCertified": false\n'
            printf '}\n'
          } > "$distribution/distribution-manifest.json"
          (
            cd "$distribution"
            zip -j -9 -X ReiAnix-native-debug.zip \
              ReiAnix-native-debug.apk \
              ReiAnix-native-debug.apk.sha256 \
              distribution-manifest.json
          )
          unzip -tq "$distribution/ReiAnix-native-debug.zip"
          mkdir -p "$RUNNER_TEMP/reianix-native-zip-check"
          unzip -q -o "$distribution/ReiAnix-native-debug.zip" -d "$RUNNER_TEMP/reianix-native-zip-check"
          cmp -s "$distribution/ReiAnix-native-debug.apk" "$RUNNER_TEMP/reianix-native-zip-check/ReiAnix-native-debug.apk"
          (
            cd "$RUNNER_TEMP/reianix-native-zip-check"
            sha256sum -c ReiAnix-native-debug.apk.sha256
          )
          test -s "$distribution/ReiAnix-native-debug.zip"
          test "$(git rev-parse HEAD)" = "$REIANIX_SOURCE_SHA"
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Upload native Gradle APK validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReiAnix-native-gradle-apk-${{ github.run_number }}
          path: |
            build/native-gradle-distribution/ReiAnix-native-debug.apk
            build/native-gradle-distribution/ReiAnix-native-debug.apk.sha256
            build/native-gradle-distribution/distribution-manifest.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload native Gradle ZIP validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReiAnix-native-gradle-ZIP-${{ github.run_number }}
          path: build/native-gradle-distribution/ReiAnix-native-debug.zip
          if-no-files-found: error
          retention-days: 1
