name: ReiAnix Kotlin/JVM Source Validation

on:
  pull_request:
    paths:
      - "android/app/src/main/kotlin/com/reiflix/reiflix_local/data/artwork/**"
      - "android/app/src/main/kotlin/com/reiflix/reiflix_local/data/catalog/**"
      - "android/app/src/main/kotlin/com/reiflix/reiflix_local/data/anilist/**"
      - "android/app/src/test/kotlin/com/reiflix/reiflix_local/data/artwork/**"
      - "android/app/src/test/kotlin/com/reiflix/reiflix_local/data/catalog/**"
      - "android/app/src/test/kotlin/com/reiflix/reiflix_local/data/anilist/**"
      - "android/app/src/main/kotlin/com/reiflix/reiflix_local/data/settings/**"
      - "android/app/src/main/kotlin/com/reiflix/reiflix_local/ui/home/**"
      - "android/app/src/main/kotlin/com/reiflix/reiflix_local/ui/host/**"
      - "android/app/src/main/kotlin/com/reiflix/reiflix_local/ui/library/**"
      - "android/app/src/main/kotlin/com/reiflix/reiflix_local/ui/settings/**"
      - "android/app/src/main/kotlin/com/reiflix/reiflix_local/ui/theme/**"
      - "android/app/src/main/kotlin/com/reiflix/reiflix_local/viewmodel/ReiAnixSettingsViewModel.kt"
      - "android/app/src/test/kotlin/com/reiflix/reiflix_local/ReiAnixSettingsContractTest.kt"
      - ".github/workflows/kotlin_jvm_tests.yml"
  workflow_dispatch:

concurrency:
  group: reianix-kotlin-jvm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kotlin-jvm:
    name: Kotlin source compilation (no emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;36.0.0 platforms;android-36"
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Validate native source layout
        shell: bash
        run: |
          set -euo pipefail
          test -s android/settings.gradle.kts
          test -s android/build.gradle.kts
          test -s android/app/build.gradle.kts
          test -s android/app/src/main/AndroidManifest.xml
          test -s android/app/src/main/kotlin/com/reiflix/reiflix_local/MainActivity.kt
          test -s android/app/src/main/kotlin/com/reiflix/reiflix_local/ReiAnixApplication.kt
          test ! -e main.py
          git diff --check
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Run focused artwork JVM tests and compile release Kotlin sources
        shell: bash
        env:
          GRADLE_OPTS: "-Dorg.gradle.caching=true -Dorg.gradle.parallel=true -Dorg.gradle.workers.max=2"
        run: |
          set -euo pipefail
          gradle -p android --no-daemon --console=plain --stacktrace --max-workers=2 \
            -PreianixBuildNumber="$GITHUB_RUN_NUMBER" \
            -PreianixBuildVersion="0.2.1" \
            :app:testDebugUnitTest \
              --tests com.reiflix.reiflix_local.data.artwork.ReiAnixLocalArtworkSidecarPolicyTest \
              --tests com.reiflix.reiflix_local.data.artwork.ReiAnixArtworkCandidatePolicyTest \
              --tests com.reiflix.reiflix_local.data.artwork.ReiAnixArtworkPublicationSignalTest \
              --tests com.reiflix.reiflix_local.data.catalog.ReiAnixExternalCatalogContractsTest \
              --tests com.reiflix.reiflix_local.data.anilist.ReiAnixAniListSearchTermsTest \
              --tests com.reiflix.reiflix_local.data.anilist.ReiAnixAniListClientTest \
              --tests com.reiflix.reiflix_local.ReiAnixSettingsContractTest \
            :app:compileReleaseKotlin
