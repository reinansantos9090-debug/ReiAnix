name: Build ReiAnix Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python for source validation and SQLite contract generation
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up standalone Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Install source validation tooling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements.txt pytest
          python --version
          gradle --version

      - name: Validate public Google configuration for the native Android resource
        shell: bash
        env:
          REIFLIX_GOOGLE_WEB_CLIENT_ID: ${{ vars.REIFLIX_GOOGLE_WEB_CLIENT_ID || secrets.REIFLIX_GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -euo pipefail
          cp android/app/src/main/res/values/strings.xml build/reiflix-strings.source.xml
          python - <<'PY'
          import os
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path("android/app/src/main/res/values/strings.xml")
          client_id = os.environ.get("REIFLIX_GOOGLE_WEB_CLIENT_ID", "").strip()
          if client_id and not re.fullmatch(r"[0-9]+-[a-z0-9-]+\.apps\.googleusercontent\.com", client_id):
              raise SystemExit("REIFLIX_GOOGLE_WEB_CLIENT_ID must be a valid public Google Web client ID.")
          root = ET.parse(path).getroot()
          resource = next((node for node in root.findall("string") if node.get("name") == "reiflix_google_web_client_id"), None)
          if resource is None:
              resource = ET.SubElement(root, "string", {"name": "reiflix_google_web_client_id"})
          resource.text = client_id
          ET.ElementTree(root).write(path, encoding="utf-8", xml_declaration=True)
          if client_id.endswith(".apps.googleusercontent.com"):
              print("GOOGLE_WEB_CLIENT_ID=validated")
          else:
              print("GOOGLE_WEB_CLIENT_ID missing; login will show configuration required.")
          PY

      - name: Validate JSON configuration
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            python -m json.tool "$file" >/dev/null
            echo "Valid JSON: $file"
          done < <(find . -path './.git' -prune -o -path './build' -prune -o -type f -name '*.json' -print0)

      - name: Run Python regression suite
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q | tee build/pytest.txt

      - name: Validate retained Python source and repository integrity
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q main.py app_config.py core views scripts
          bash -n scripts/run_android_instrumented_diagnostic.sh
          python scripts/audit_release.py --root .
          git diff --check
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"

      - name: Generate canonical SQLite runtime contract and JVM fixture
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_native_sqlite_test_fixture.py \
            --output android/app/src/test/resources/native-sqlite-schema-v29.json \
            --contract-output android/app/src/main/assets/native-sqlite-contract-v29.json
          test -s android/app/src/test/resources/native-sqlite-schema-v29.json
          test -s android/app/src/main/assets/native-sqlite-contract-v29.json

      - name: Configure Android release signing
        shell: bash
        env:
          REIFLIX_ANDROID_KEYSTORE_B64: ${{ secrets.REIFLIX_ANDROID_KEYSTORE_B64 }}
          REIFLIX_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.REIFLIX_ANDROID_KEYSTORE_PASSWORD }}
          REIFLIX_ANDROID_KEY_PASSWORD: ${{ secrets.REIFLIX_ANDROID_KEY_PASSWORD }}
          REIFLIX_ANDROID_KEY_ALIAS: ${{ secrets.REIFLIX_ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -n "${REIFLIX_ANDROID_KEYSTORE_B64:-}" && -n "${REIFLIX_ANDROID_KEYSTORE_PASSWORD:-}" && -n "${REIFLIX_ANDROID_KEY_PASSWORD:-}" && -n "${REIFLIX_ANDROID_KEY_ALIAS:-}" ]]; then
            printf "%s" "$REIFLIX_ANDROID_KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/build/reiflix-release.jks"
            test -s "$GITHUB_WORKSPACE/build/reiflix-release.jks"
            {
              echo "REIFLIX_ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/build/reiflix-release.jks"
              echo "REIFLIX_ANDROID_KEYSTORE_PASSWORD=$REIFLIX_ANDROID_KEYSTORE_PASSWORD"
              echo "REIFLIX_ANDROID_KEY_PASSWORD=$REIFLIX_ANDROID_KEY_PASSWORD"
              echo "REIFLIX_ANDROID_KEY_ALIAS=$REIFLIX_ANDROID_KEY_ALIAS"
              echo "REIFLIX_SIGNING_MODE=stable"
            } >> "$GITHUB_ENV"
            echo "Stable Android release signing configured."
          else
            {
              echo "REIFLIX_ANDROID_KEYSTORE_PATH="
              echo "REIFLIX_SIGNING_MODE=debug"
            } >> "$GITHUB_ENV"
            echo "::warning::Stable Android signing secrets are not configured; this APK uses the debug signing key and is not update-compatible with stable release installs."
          fi

      - name: Write native build identity
        shell: bash
        env:
          REIFLIX_BUILD_SHA: ${{ github.sha }}
          REIFLIX_BUILD_NUMBER: ${{ github.run_number }}
          REIFLIX_BUILD_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          payload = {
              "commit_sha": os.environ["REIFLIX_BUILD_SHA"],
              "build_number": os.environ["REIFLIX_BUILD_NUMBER"],
              "build_version": "0.2.1",
              "branch": os.environ["REIFLIX_BUILD_BRANCH"],
              "timestamp_utc": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "android_runtime": "native-kotlin-compose",
              "android_entrypoint": "com.reiflix.reiflix_local.MainActivity",
              "python_runtime_packaged": False,
              "flet_runtime_packaged": False,
              "flutter_runtime_packaged": False,
              "main_py_packaged": False,
          }
          Path("build/reiflix-build-identity.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          test -s build/reiflix-build-identity.json

      - name: Build native Android release APK
        shell: bash
        env:
          GRADLE_OPTS: "-Dorg.gradle.caching=true -Dorg.gradle.parallel=false -Dorg.gradle.workers.max=2"
        run: |
          set -euo pipefail
          gradle -p android --no-daemon --console=plain --stacktrace \
            -PreianixBuildNumber="$GITHUB_RUN_NUMBER" \
            -PreianixBuildVersion="0.2.1" \
            :app:assembleRelease

      - name: Explicitly verify release Kotlin compilation
        shell: bash
        env:
          GRADLE_OPTS: "-Dorg.gradle.caching=true -Dorg.gradle.parallel=false"
        run: |
          set -euo pipefail
          gradle -p android --no-daemon --console=plain \
            -PreianixBuildNumber="$GITHUB_RUN_NUMBER" \
            -PreianixBuildVersion="0.2.1" \
            :app:compileReleaseKotlin

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          source_apk="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$source_apk"
          cp "$source_apk" build/ReiAnix.apk
          test -s build/ReiAnix.apk
          file build/ReiAnix.apk
          echo "path=build/ReiAnix.apk" >> "$GITHUB_OUTPUT"

      - name: Verify native APK contains no Python, Flet, or Flutter runtime
        shell: bash
        run: |
          set -euo pipefail
          apk="${{ steps.apk.outputs.path }}"
          python scripts/verify_android_host.py "$apk"
          python scripts/verify_native_apk.py "$apk"
          aapt2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          badging="$("$aapt2" dump badging "$apk")"
          echo "$badging" | grep -q "package: name='com.reiflix.reiflix_local'"
          echo "$badging" | grep -q "versionCode='$GITHUB_RUN_NUMBER'"
          echo "$badging" | grep -q "versionName='0.2.1'"
          echo "$badging" | grep -q "targetSdkVersion:'36'"
          "$aapt2" dump permissions "$apk" | grep -q "android.permission.MANAGE_EXTERNAL_STORAGE"
          "$aapt2" dump permissions "$apk" | grep -q "android.permission.READ_MEDIA_VIDEO"
          "$aapt2" dump permissions "$apk" | grep -q "android.permission.READ_MEDIA_VISUAL_USER_SELECTED"

      - name: Verify compiled Compose classes and APK DEX packaging
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_compose_packaging.py build/ReiAnix.apk \
            --classes-root android/app/build/tmp/kotlin-classes/release

      - name: Verify effective APK AndroidManifest
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_apk_manifest.py build/ReiAnix.apk \
            --aapt2 "$ANDROID_HOME/build-tools/36.0.0/aapt2" \
            --expected-version-code "$GITHUB_RUN_NUMBER" \
            --expected-version-name "0.2.1"

      - name: Print and publish APK SHA-256
        shell: bash
        run: |
          set -euo pipefail
          (cd build && sha256sum ReiAnix.apk) | tee build/ReiAnix.apk.sha256
          aapt2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          {
            cat build/reiflix-build-identity.json
            echo
            echo "signing_mode=${REIFLIX_SIGNING_MODE:-unknown}"
            "$aapt2" dump badging build/ReiAnix.apk | grep -E "package: name=|versionCode=|versionName=|targetSdkVersion"
          } | tee build/reiflix-release-metadata.txt
          test -s build/reiflix-release-metadata.txt

      - name: Print APK signing certificate fingerprints
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs build/ReiAnix.apk

      - name: Final Git integrity check
        shell: bash
        run: |
          set -euo pipefail
          cp build/reiflix-strings.source.xml android/app/src/main/res/values/strings.xml
          rm -f android/app/src/test/resources/native-sqlite-schema-v29.json
          rm -f android/app/src/main/assets/native-sqlite-contract-v29.json
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --check
          status="$(git status --porcelain)"
          if [ -n "$status" ]; then
            echo "Unexpected working-tree changes:"
            printf '%s\n' "$status"
            git diff --stat
            exit 1
          fi
          test -s build/ReiAnix.apk
          test -s build/reiflix-build-identity.json

      - name: Write Portuguese install instructions
        shell: bash
        run: |
          set -euo pipefail
          cat > build/LEIA-ANTES-DE-INSTALAR.txt <<'EOF'
          REIANIX — COMO INSTALAR NO ANDROID

          1. Toque diretamente em ReiAnix.apk e escolha Instalar.
          2. Se o Android bloquear, permita “Instalar apps desconhecidos” para o gerenciador de arquivos e tente novamente.
          3. ReiAnix.apk.sha256 é somente um checksum de verificação; não instale esse arquivo.
          4. Se o Android mostrar “App não instalado” ou “Pacote inválido”, envie a mensagem exata.
          EOF
          test -s build/LEIA-ANTES-DE-INSTALAR.txt

      - name: Create downloadable APK ZIP
        shell: bash
        run: |
          set -euo pipefail
          zip -j -9 -X build/ReiAnix-apk.zip build/ReiAnix.apk build/ReiAnix.apk.sha256 build/LEIA-ANTES-DE-INSTALAR.txt
          unzip -tq build/ReiAnix-apk.zip
          test -s build/ReiAnix-apk.zip
          unzip -Z1 build/ReiAnix-apk.zip | grep -Fx 'ReiAnix.apk'
          unzip -Z1 build/ReiAnix-apk.zip | grep -Fx 'ReiAnix.apk.sha256'
          unzip -Z1 build/ReiAnix-apk.zip | grep -Fx 'LEIA-ANTES-DE-INSTALAR.txt'
          apk_bytes="$(stat -c '%s' build/ReiAnix.apk)"
          zip_bytes="$(stat -c '%s' build/ReiAnix-apk.zip)"
          printf 'APK_SIZE_BYTES=%s\nZIP_SIZE_BYTES=%s\n' "$apk_bytes" "$zip_bytes"
          test "$zip_bytes" -le "$((apk_bytes + 1048576))"

      - name: Publish APK and ZIP to rolling GitHub Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: reianix-ci-latest
        shell: bash
        run: |
          set -euo pipefail
          release_args=(
            --repo "$GITHUB_REPOSITORY"
            --title "ReiAnix CI — latest"
            --notes "Native Kotlin/Compose APK from commit $GITHUB_SHA."
            --latest=false
          )
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" "${release_args[@]}"
            gh release upload "$RELEASE_TAG" \
              build/ReiAnix.apk build/ReiAnix-apk.zip build/ReiAnix.apk.sha256 \
              build/LEIA-ANTES-DE-INSTALAR.txt build/reiflix-release-metadata.txt \
              build/reiflix-build-identity.json --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" \
              build/ReiAnix.apk build/ReiAnix-apk.zip build/ReiAnix.apk.sha256 \
              build/LEIA-ANTES-DE-INSTALAR.txt build/reiflix-release-metadata.txt \
              build/reiflix-build-identity.json "${release_args[@]}" --target "$GITHUB_SHA"
          fi

      - name: Upload APK to Actions run
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ReiAnix-apk-instalacao-direta-${{ github.run_number }}
          path: |
            build/ReiAnix.apk
            build/ReiAnix.apk.sha256
            build/LEIA-ANTES-DE-INSTALAR.txt
            build/reiflix-release-metadata.txt
            build/reiflix-build-identity.json
          retention-days: 1
          if-no-files-found: error

      - name: Upload APK ZIP to Actions run
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ReiAnix-ZIP-extraia-primeiro-${{ github.run_number }}
          path: build/ReiAnix-apk.zip
          retention-days: 1
          if-no-files-found: error
