name: Incorporar artes originais (temporário)
on:
  push:
    branches: ["work/profile-banner-art-collection"]
    paths: [".github/workflows/import_profile_art_once.yml"]
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/profile-banner-art-collection
      - name: Verificar e incorporar as artes
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl --fail --silent --show-error --location --max-time 90 'https://d2ol7oe51mr4n9.cloudfront.net/user_3JGsEe5GEDYVpaPlZj1DKZVGpOD/3cbd202a-457b-461e-9289-5b5ce9dd5c87.zip' -o "$tmp/pack.zip"
          echo "4650b3c9338d0b7ba7ac8a913c8b85abd66bce742d092e9e5dac3e3bb7c9fed0  $tmp/pack.zip" | sha256sum -c -
          python3 - "$tmp/pack.zip" <<'PY'
          import pathlib, zipfile, sys
          root = pathlib.Path("android/app/src/main/assets/personalization")
          names = {
              "banners": "chuva_neon cidade_dourada eclipse_rubro floresta_encantada montanha_nevada quarto_gamer ruinas_submersas sakura_lunar santuario_celestial trem_de_outono",
              "wallpapers": "cafe_chuvoso caminho_sakura cascatas_misticas cidade_cyberpunk costa_ao_entardecer crepusculo_urbano magia_violeta montanhas_estreladas vale_dos_templos viajante_lunar"
          }
          expected = {str(root / category / (name + ".webp")) for category, items in names.items() for name in items.split()}
          with zipfile.ZipFile(sys.argv[1]) as archive:
              assert set(archive.namelist()) == expected | {"README.txt"}
              for name in sorted(expected):
                  data = archive.read(name)
                  assert data[:4] == b"RIFF" and data[8:12] == b"WEBP"
                  target = pathlib.Path(name)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
          PY
          git add android/app/src/main/assets/personalization
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --quiet || git commit -m 'Inclui 20 artes WebP originais no APK'
          git push origin HEAD:work/profile-banner-art-collection
