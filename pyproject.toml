[project]
name = "reiflix-local"
version = "0.2.1"
requires-python = ">=3.12,<3.13"
dependencies = ["flet==0.86.5", "certifi>=2024.8.30", "Pillow>=11.0,<13"]

[tool.flet]
org = "com.reiflix"
product = "ReiAnix Local"
company = "ReiAnix"

# INTERNET is a normal permission, used only for AniList metadata, cached cover
# downloads, and the configured OAuth/OIDC flow. Android storage access is
# implemented by the native overlay: SAF, MediaStore video permission, and the
# optional broad-storage special access used by the local-library scanner.
[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.MANAGE_EXTERNAL_STORAGE" = true

[tool.flet.android]
min_sdk_version = 24
target_sdk_version = 36

[tool.flet.flutter.pubspec.dependency_overrides]
# Flet 0.86.5 templates can pin jni 1.0.x while the generated jni_flutter bindings
# require jni >=1.1.0. Keep the Flutter dependency graph internally consistent.
jni = "1.1.0"

[tool.flet.app]
# Keep development-only tests, docs and CI metadata out of the production app bundle.
exclude = ["tests", "docs", ".github", "android", "scripts", ".pytest_cache", ".mypy_cache", "README.md", "BACKUP_RESTORE.md", ".env.example", ".gitignore", "pyproject.toml", "requirements.txt", ".reiflix-build-identity.json", "build-flet-version.txt"]
