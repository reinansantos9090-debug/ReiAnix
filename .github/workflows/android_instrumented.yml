name: ReiAnix Android Instrumented Runtime Tests

on:
  workflow_dispatch:

concurrency:
  group: reianix-android-instrumented-manual
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  instrumented:
    name: Native Android API 36
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 emulator"
          accept-android-sdk-licenses: true

      - name: Set up standalone Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify Kotlin-only project inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s android/settings.gradle.kts
          test -s android/build.gradle.kts
          test -s android/app/build.gradle.kts
          test -s android/app/src/main/AndroidManifest.xml
          test -s android/app/src/main/kotlin/com/reiflix/reiflix_local/MainActivity.kt
          test -s android/app/src/main/kotlin/com/reiflix/reiflix_local/ReiAnixApplication.kt
          test -s android/app/src/main/assets/native-sqlite-contract-v29.json.gz
          test ! -e main.py
          test ! -e app_config.py
          test ! -e requirements.txt
          test ! -e pyproject.toml
          if find . -path './.git' -prune -o -type f \( -name '*.py' -o -name '*.pyc' \) -print | grep -q .; then
            echo "Unexpected Python source/bytecode remains in the repository."
            find . -path './.git' -prune -o -type f \( -name '*.py' -o -name '*.pyc' \) -print
            exit 1
          fi
          git diff --check

      - name: Install fixture tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg sqlite3

      - name: Generate native instrumentation fixtures
        shell: bash
        run: |
          set -euo pipefail
          assets="android/app/src/androidTest/assets"
          mkdir -p "$assets"
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "color=c=black:s=640x360:r=30" \
            -f lavfi -i "anullsrc=channel_layout=stereo:sample_rate=44100" \
            -t 12 -shortest -c:v mpeg4 -q:v 5 -c:a aac -movflags +faststart \
            "$assets/player_fixture.mp4"
          test -s "$assets/player_fixture.mp4"

          contract="$RUNNER_TEMP/native-sqlite-contract-v29.json"
          gzip -dc android/app/src/main/assets/native-sqlite-contract-v29.json.gz > "$contract"
          db="$assets/library_fixture.sqlite3"
          rm -f "$db"
          jq -r '.table_sql[]' "$contract" | sqlite3 "$db"
          jq -r '.indexes[]? | select(.sql != null) | .sql' "$contract" | sqlite3 "$db"
          sqlite3 "$db" <<'SQL'
          PRAGMA foreign_keys=OFF;
          INSERT INTO anime (id, title, anilist_id)
            VALUES (1, 'ReiAnix Test Collection', 16498);
          INSERT INTO episodes (id, anime_id, number, path, media_identity, progress)
            VALUES
              (101, 1, 1, 'content://reianix-fixture/episode-01.mp4', 'fixture-identity-01', 37),
              (102, 1, 2, 'content://reianix-fixture/episode-02.mp4', 'fixture-identity-02', 0),
              (103, 1, 3, 'content://reianix-fixture/episode-03.mp4', 'fixture-identity-03', 0),
              (104, 1, 4, 'content://reianix-fixture/episode-04.mp4', 'fixture-identity-04', 0),
              (105, 1, 5, 'content://reianix-fixture/episode-05.mp4', 'fixture-identity-05', 0);
          SQL
          test "$(sqlite3 "$db" 'SELECT count(*) FROM episodes WHERE anime_id=1;')" = "5"
          test "$(sqlite3 "$db" 'SELECT progress FROM episodes WHERE anime_id=1 ORDER BY number LIMIT 1;')" = "37"

      - name: Compile native app and instrumentation sources
        shell: bash
        env:
          GRADLE_OPTS: "-Dorg.gradle.caching=true -Dorg.gradle.parallel=true -Dorg.gradle.workers.max=2"
        run: |
          set -euo pipefail
          gradle -p android --no-daemon --console=plain --stacktrace --max-workers=2 \
            -PreianixBuildNumber="$GITHUB_RUN_NUMBER" \
            -PreianixBuildVersion="0.2.1" \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            :app:assembleDebugAndroidTest \
            :app:compileReleaseKotlin

      - name: Run Android instrumentation tests on API 36
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-boot-timeout: 360
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: "-no-window -no-audio -no-boot-anim -no-snapshot -no-snapshot-save -gpu swiftshader_indirect -camera-back none -camera-front none"
          script: bash "$GITHUB_WORKSPACE/scripts/run_android_instrumented.sh" "36" "$GITHUB_WORKSPACE/build/android-api36"

      - name: Capture Android runtime diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          out="$GITHUB_WORKSPACE/build/android-api36"
          mkdir -p "$out"
          capture() {
            local output="$1"
            shift
            timeout --signal=TERM --kill-after=5s 30s "$@" >"$output" 2>&1
            local status=$?
            if [ "$status" -ne 0 ]; then
              printf '\nCOMMAND_EXIT=%s\n' "$status" >>"$output"
            fi
            return 0
          }
          capture "$out/adb_devices.txt" adb devices -l
          capture "$out/sdk.txt" adb shell getprop ro.build.version.sdk
          capture "$out/activity_top.txt" adb shell dumpsys activity top
          capture "$out/package.txt" adb shell dumpsys package com.reiflix.reiflix_local
          capture "$out/logcat.txt" adb logcat -d -b all -v threadtime
          {
            echo "## Android runtime diagnostics"
            echo "SDK:"
            cat "$out/sdk.txt" 2>/dev/null
            echo "--- adb devices ---"
            cat "$out/adb_devices.txt" 2>/dev/null
          } >> "$GITHUB_STEP_SUMMARY"
          set -e

      - name: Remove generated test fixtures
        if: always()
        shell: bash
        run: |
          rm -f android/app/src/androidTest/assets/player_fixture.mp4
          rm -f android/app/src/androidTest/assets/library_fixture.sqlite3
          rmdir android/app/src/androidTest/assets 2>/dev/null || true

      - name: Upload Android instrumentation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ReiAnix-android-api36-diagnostics-${{ github.run_number }}
          path: |
            build/android-api36/**
            android/app/build/reports/**
            android/app/build/test-results/**
            android/app/build/outputs/androidTest-results/**
          retention-days: 7
          if-no-files-found: warn
