name: Build ReiAnix Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run TMDB metadata backend unit tests
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node --test backend/tmdb-metadata-worker/src/index.test.js

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
          accept-android-sdk-licenses: true

      - name: Set up standalone Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-read-only: true

      - name: Validate canonical SQLite v29 runtime contract
        shell: bash
        run: |
          set -euo pipefail
          contract="android/app/src/main/assets/native-sqlite-contract-v29.json.gz"
          test -s "$contract"
          gzip -dc "$contract" | jq -e '.schema_version == 29 and (.tables | length == 14) and (.table_sql | length == 14)' >/dev/null
          echo "Canonical SQLite v29 runtime contract is valid."
      - name: Validate JSON configuration
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            jq empty "$file"
            echo "Valid JSON: $file"
          done < <(find . -path './.git' -prune -o -path './build' -prune -o -type f -name '*.json' -print0)

      - name: Configure optional public Google client ID
        shell: bash
        env:
          REIFLIX_GOOGLE_WEB_CLIENT_ID: ${{ vars.REIFLIX_GOOGLE_WEB_CLIENT_ID || secrets.REIFLIX_GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -euo pipefail
          strings_file="android/app/src/main/res/values/strings.xml"
          cp "$strings_file" build-strings-source.xml
          client_id="${REIFLIX_GOOGLE_WEB_CLIENT_ID:-}"
          if [[ -n "$client_id" && ! "$client_id" =~ ^[0-9]+-[a-z0-9-]+\.apps\.googleusercontent\.com$ ]]; then
            echo "REIFLIX_GOOGLE_WEB_CLIENT_ID must be a valid public Google Web client ID."
            exit 1
          fi
          sed -i -E "s#<string name=\"reiflix_google_web_client_id\">[^<]*</string>#<string name=\"reiflix_google_web_client_id\">$client_id</string>#" "$strings_file"
          if [[ -n "$client_id" ]]; then
            echo "GOOGLE_WEB_CLIENT_ID=validated"
          else
            echo "GOOGLE_WEB_CLIENT_ID missing; login will show configuration required."
          fi

      - name: Validate optional TMDB metadata backend and live search
        shell: bash
        env:
          REIANIX_TMDB_METADATA_BACKEND_URL: ${{ vars.REIANIX_TMDB_METADATA_BACKEND_URL }}
        run: |
          set -euo pipefail
          backend_url="${REIANIX_TMDB_METADATA_BACKEND_URL:-}"
          if [[ -z "${backend_url//[[:space:]]/}" ]]; then
            echo "::notice::TMDB metadata backend is not configured; the APK will keep AniList available and skip TMDB search."
            echo "TMDB metadata backend: not configured; this APK will not perform TMDB fallback until a real backend origin is configured." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ ! "$backend_url" =~ ^https://([[:alnum:]-]+\.)+[[:alnum:]-]+(:[0-9]{1,5})?/?$ ]]; then
            echo "::error::TMDB metadata backend must be an HTTPS origin without credentials, path, query, or fragment."
            exit 1
          fi
          backend_url="${backend_url%/}"
          health_file="$(mktemp)"
          response_file="$(mktemp)"
          chmod 600 "$health_file" "$response_file"
          trap 'rm -f "$health_file" "$response_file"' EXIT
          health_status="$(curl --silent --output "$health_file" --write-out '%{http_code}' --max-time 10 "$backend_url/healthz" 2>/dev/null || true)"
          if [[ "$health_status" != "200" ]] || ! jq -e '.status == "ok"' "$health_file" >/dev/null; then
            echo "::error::Configured TMDB metadata backend health check did not pass (HTTP $health_status). No live-backend claim is made."
            exit 1
          fi
          search_status="$(curl --silent --output "$response_file" --write-out '%{http_code}' --max-time 20 \
            -H 'Content-Type: application/json' \
            --data '{"query":"Cowboy Bebop","mediaKind":"tv","language":"en-US","year":1998,"includeAdult":false}' \
            "$backend_url/v1/metadata/tmdb/search" 2>/dev/null || true)"
          if [[ "$search_status" != "200" ]] || ! jq -e '(.results | type == "array") and all(.results[]; (.id | type == "number") and ((.name | type == "string") or (.name == null)) and ((.poster_path | type == "string") or (.poster_path == null)))' "$response_file" >/dev/null; then
            echo "::error::Configured TMDB metadata backend search did not return valid JSON (HTTP $search_status). No live-backend claim is made."
            exit 1
          fi
          result_count="$(jq '.results | length' "$response_file")"
          poster_count="$(jq '[.results[] | select((.poster_path | type == "string") and (.poster_path | startswith("/")) and (.poster_path | startswith("//") | not))] | length' "$response_file")"
          if [[ "$result_count" -eq 0 || "$poster_count" -eq 0 ]]; then
            echo "::error::Configured backend returned no usable poster candidate; APK creation is blocked for this configuration."
            exit 1
          fi
          echo "TMDB metadata backend live check: HTTP 200; JSON valid; results=$result_count; poster_candidates=$poster_count."
          echo "TMDB metadata backend: live health and search checks passed; results=$result_count; usable poster candidates=$poster_count." >> "$GITHUB_STEP_SUMMARY"

      - name: Validate native Kotlin entry point and repository integrity
        shell: bash
        run: |
          set -euo pipefail
          test -s android/settings.gradle.kts
          test -s android/build.gradle.kts
          test -s android/app/build.gradle.kts
          test -s android/app/src/main/AndroidManifest.xml
          test -s android/app/src/main/res/values/colors.xml
          test -s android/app/src/main/res/drawable/ic_launcher_foreground.xml
          test -s android/app/src/main/assets/native-sqlite-contract-v29.json.gz
          test -s android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -s android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          grep -Fq 'android:icon="@mipmap/ic_launcher"' android/app/src/main/AndroidManifest.xml
          grep -Fq 'android:roundIcon="@mipmap/ic_launcher_round"' android/app/src/main/AndroidManifest.xml
          test -s android/app/src/main/kotlin/com/reiflix/reiflix_local/MainActivity.kt
          test -s android/app/src/main/kotlin/com/reiflix/reiflix_local/ReiAnixApplication.kt
          test ! -e main.py
          test ! -e app_config.py
          test ! -e requirements.txt
          test ! -e pyproject.toml
          if find . -path './.git' -prune -o -path './build' -prune -o -type f \( -name '*.py' -o -name '*.pyc' \) -print | grep -q .; then
            echo "Unexpected Python source/bytecode remains in the repository."
            exit 1
          fi
          test -n "$(find android/app/src/main/kotlin -type f -name '*.kt' -print -quit)"
          grep -Fq 'android:name=".MainActivity"' android/app/src/main/AndroidManifest.xml
          git diff --check
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Run one-time TMDB security and artwork regression tests
        shell: bash
        env:
          GRADLE_OPTS: "-Dorg.gradle.caching=false -Dorg.gradle.parallel=true -Dorg.gradle.workers.max=2"
        run: |
          set -euo pipefail
          gradle -p android --no-daemon --console=plain --stacktrace --max-workers=2 \
            -PreianixBuildNumber="$GITHUB_RUN_NUMBER" \
            -PreianixBuildVersion="0.2.1" \
            :app:testDebugUnitTest \
            --tests com.reiflix.reiflix_local.data.metadata.ReiAnixMetadataProvidersTest \
            --tests com.reiflix.reiflix_local.ReiAnixBuildSecretSafetyTest \
            --tests com.reiflix.reiflix_local.data.artwork.ReiAnixArtworkCandidatePolicyTest \
            --tests com.reiflix.reiflix_local.data.artwork.ReiAnixArtworkPublicationSignalTest \
            --tests com.reiflix.reiflix_local.data.artwork.ReiAnixTmdbArtworkCachePolicyTest \
            --tests com.reiflix.reiflix_local.data.library.ReiAnixNativeLibraryCatalogProjectorArtworkTest \
            --tests com.reiflix.reiflix_local.data.sqlite.ReiAnixNativeSearchTextTest.nullableMetadataTextDoesNotAbortLibrarySearchProjection

      - name: Configure Android release signing
        shell: bash
        env:
          REIFLIX_ANDROID_KEYSTORE_B64: ${{ secrets.REIFLIX_ANDROID_KEYSTORE_B64 }}
          REIFLIX_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.REIFLIX_ANDROID_KEYSTORE_PASSWORD }}
          REIFLIX_ANDROID_KEY_PASSWORD: ${{ secrets.REIFLIX_ANDROID_KEY_PASSWORD }}
          REIFLIX_ANDROID_KEY_ALIAS: ${{ secrets.REIFLIX_ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p build
          if [[ -n "${REIFLIX_ANDROID_KEYSTORE_B64:-}" && -n "${REIFLIX_ANDROID_KEYSTORE_PASSWORD:-}" && -n "${REIFLIX_ANDROID_KEY_PASSWORD:-}" && -n "${REIFLIX_ANDROID_KEY_ALIAS:-}" ]]; then
            printf "%s" "$REIFLIX_ANDROID_KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/build/reiflix-release.jks"
            test -s "$GITHUB_WORKSPACE/build/reiflix-release.jks"
            {
              echo "REIFLIX_ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/build/reiflix-release.jks"
              echo "REIFLIX_ANDROID_KEYSTORE_PASSWORD=$REIFLIX_ANDROID_KEYSTORE_PASSWORD"
              echo "REIFLIX_ANDROID_KEY_PASSWORD=$REIFLIX_ANDROID_KEY_PASSWORD"
              echo "REIFLIX_ANDROID_KEY_ALIAS=$REIFLIX_ANDROID_KEY_ALIAS"
              echo "REIFLIX_SIGNING_MODE=stable"
            } >> "$GITHUB_ENV"
            echo "Stable Android release signing configured."
          else
            {
              echo "REIFLIX_ANDROID_KEYSTORE_PATH="
              echo "REIFLIX_SIGNING_MODE=debug"
            } >> "$GITHUB_ENV"
            echo "::warning::Stable Android signing secrets are not configured; this APK uses the debug signing key and is not update-compatible with stable release installs."
          fi

      - name: Write native build identity
        shell: bash
        env:
          REIFLIX_BUILD_SHA: ${{ github.sha }}
          REIFLIX_BUILD_NUMBER: ${{ github.run_number }}
          REIFLIX_BUILD_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p build
          jq -n \
            --arg commit_sha "$REIFLIX_BUILD_SHA" \
            --arg build_number "$REIFLIX_BUILD_NUMBER" \
            --arg build_version "0.2.1" \
            --arg branch "$REIFLIX_BUILD_BRANCH" \
            --arg timestamp_utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              commit_sha: $commit_sha,
              build_number: $build_number,
              build_version: $build_version,
              branch: $branch,
              timestamp_utc: $timestamp_utc,
              android_runtime: "native-kotlin-compose",
              android_entrypoint: "com.reiflix.reiflix_local.MainActivity",
              python_runtime_packaged: false,
              flet_runtime_packaged: false,
              flutter_runtime_packaged: false,
              main_py_packaged: false
            }' > build/reiflix-build-identity.json
          test -s build/reiflix-build-identity.json

      - name: Build native Android release APK
        shell: bash
        env:
          REIANIX_TMDB_METADATA_BACKEND_URL: ${{ vars.REIANIX_TMDB_METADATA_BACKEND_URL }}
          GRADLE_OPTS: "-Dorg.gradle.caching=false -Dorg.gradle.parallel=true -Dorg.gradle.workers.max=4"
        run: |
          set -euo pipefail
          gradle -p android --no-daemon --console=plain --stacktrace \
            -PreianixBuildNumber="$GITHUB_RUN_NUMBER" \
            -PreianixBuildVersion="0.2.1" \
            :app:assembleRelease

      - name: Explicitly verify release Kotlin compilation
        shell: bash
        env:
          REIANIX_TMDB_METADATA_BACKEND_URL: ${{ vars.REIANIX_TMDB_METADATA_BACKEND_URL }}
          GRADLE_OPTS: "-Dorg.gradle.caching=true -Dorg.gradle.parallel=true -Dorg.gradle.workers.max=4"
        run: |
          set -euo pipefail
          gradle -p android --no-daemon --console=plain \
            -PreianixBuildNumber="$GITHUB_RUN_NUMBER" \
            -PreianixBuildVersion="0.2.1" \
            :app:compileReleaseKotlin

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          source_apk="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$source_apk"
          cp "$source_apk" build/ReiAnix.apk
          test -s build/ReiAnix.apk
          file build/ReiAnix.apk
          echo "path=build/ReiAnix.apk" >> "$GITHUB_OUTPUT"

      - name: Verify APK contains no TMDB client credential
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import sys
          import zipfile

          apk_path = "build/ReiAnix.apk"
          jwt_pattern = re.compile(rb"eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}")
          findings = []
          with zipfile.ZipFile(apk_path) as apk:
              for item in apk.infolist():
                  if item.is_dir():
                      continue
                  data = apk.read(item.filename)
                  if b"TMDB_READ_ACCESS_TOKEN" in data:
                      findings.append((item.filename, "legacy BuildConfig field name"))
                  if jwt_pattern.search(data):
                      findings.append((item.filename, "JWT-shaped credential string"))
          if findings:
              for path, reason in findings:
                  print(f"APK credential scan failed: {reason} detected in {path}.")
              sys.exit(1)
          print("APK credential scan passed: no legacy TMDB token field or JWT-shaped credential string found in APK entries.")
          PY

      - name: Verify native APK payload and Android package metadata
        shell: bash
        run: |
          set -euo pipefail
          apk="${{ steps.apk.outputs.path }}"
          aapt2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          badging="$("$aapt2" dump badging "$apk")"
          echo "$badging" | grep -Fq "package: name='com.reiflix.reiflix_local'"
          echo "$badging" | grep -Fq "versionCode='$GITHUB_RUN_NUMBER'"
          echo "$badging" | grep -Fq "versionName='0.2.1'"
          echo "$badging" | grep -Fq "targetSdkVersion:'36'"
          echo "$badging" | grep -Fq "application-icon"
          "$aapt2" dump permissions "$apk" | grep -Fq "android.permission.MANAGE_EXTERNAL_STORAGE"
          "$aapt2" dump permissions "$apk" | grep -Fq "android.permission.READ_MEDIA_VIDEO"
          "$aapt2" dump permissions "$apk" | grep -Fq "android.permission.READ_MEDIA_VISUAL_USER_SELECTED"

          archive_list="$(unzip -Z1 "$apk")"
          contract_asset='assets/native-sqlite-contract-v29.json'
          if ! grep -Fxq "$contract_asset" <<< "$archive_list"; then
            echo "ERROR: packaged APK is missing $contract_asset"
            echo "SQLite-related entries actually present in the APK:"
            grep -Ei '(^assets/|sqlite|contract|\.gz$)' <<< "$archive_list" || true
            exit 1
          fi
          packaged_contract_json="$RUNNER_TEMP/packaged-native-sqlite-contract-v29.json"
          unzip -p "$apk" "$contract_asset" > "$packaged_contract_json"
          if ! jq -e '.schema_version == 29 and (.tables | length == 14) and (.table_sql | length == 14)' "$packaged_contract_json" >/dev/null; then
            echo "ERROR: the packaged SQLite contract did not satisfy the schema-v29 contract."
            jq -r '"schema_version=\(.schema_version // "missing") tables=\((.tables // []) | length) table_sql=\((.table_sql // {}) | length)"' "$packaged_contract_json" || true
            exit 1
          fi
          echo "PACKAGED_SQLITE_CONTRACT=PASS bytes=$(stat -c '%s' "$packaged_contract_json") tables=$(jq '.tables | length' "$packaged_contract_json")"
          if grep -Eiq '(^|/)(__pycache__/|[^/]+\.py[co]$|assets/app\.zip$|assets/flutter/|lib[^/]*(python|flutter)|seriouspython)' <<< "$archive_list"; then
            echo "The APK contains a forbidden Python/Flet/Flutter payload:"
            grep -Ei '(^|/)(__pycache__/|[^/]+\.py[co]$|assets/app\.zip$|assets/flutter/|lib[^/]*(python|flutter)|seriouspython)' <<< "$archive_list"
            exit 1
          fi

          dex_files="$(grep -E '^classes([0-9]+)?\.dex$' <<< "$archive_list" || true)"
          test -n "$dex_files"
          for class_name in \
            "com/reiflix/reiflix_local/MainActivity" \
            "com/reiflix/reiflix_local/ReiAnixApplication" \
            "com/reiflix/reiflix_local/NativePlayerActivity"; do
            found=0
            while IFS= read -r dex; do
              if unzip -p "$apk" "$dex" | strings | grep -F "$class_name" >/dev/null; then
                found=1
                break
              fi
            done <<< "$dex_files"
            if [[ "$found" -ne 1 ]]; then
              echo "Required native class missing from DEX: $class_name"
              exit 1
            fi
          done

      - name: Print and publish APK SHA-256
        shell: bash
        run: |
          set -euo pipefail
          (cd build && sha256sum ReiAnix.apk) | tee build/ReiAnix.apk.sha256
          aapt2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          {
            cat build/reiflix-build-identity.json
            echo
            echo "signing_mode=${REIFLIX_SIGNING_MODE:-unknown}"
            "$aapt2" dump badging build/ReiAnix.apk | grep -E "package: name=|versionCode=|versionName=|targetSdkVersion"
          } | tee build/reiflix-release-metadata.txt
          test -s build/reiflix-release-metadata.txt

      - name: Print APK signing certificate fingerprints
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs build/ReiAnix.apk

      - name: Final Git integrity check
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f build-strings-source.xml ]]; then
            cp build-strings-source.xml android/app/src/main/res/values/strings.xml
            rm -f build-strings-source.xml
          fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --check
          status="$(git status --porcelain)"
          if [[ -n "$status" ]]; then
            echo "Unexpected working-tree changes:"
            printf '%s\n' "$status"
            git diff --stat
            exit 1
          fi
          test -s build/reiflix-build-identity.json
          test -s build/ReiAnix.apk
          test -s build/ReiAnix.apk.sha256

      - name: Write Portuguese install instructions
        shell: bash
        run: |
          set -euo pipefail
          cat > build/LEIA-ANTES-DE-INSTALAR.txt <<'EOF'
          REIANIX — COMO INSTALAR NO ANDROID

          1. Toque diretamente em ReiAnix.apk e escolha Instalar.
          2. Se o Android bloquear, permita “Instalar apps desconhecidos” para o gerenciador de arquivos e tente novamente.
          3. ReiAnix.apk.sha256 é somente um checksum de verificação; não instale esse arquivo.
          4. Se o Android mostrar “App não instalado” ou “Pacote inválido”, envie a mensagem exata.
          EOF
          test -s build/LEIA-ANTES-DE-INSTALAR.txt

      - name: Create downloadable APK ZIP
        shell: bash
        run: |
          set -euo pipefail
          zip -j -9 -X build/ReiAnix-apk.zip build/ReiAnix.apk build/ReiAnix.apk.sha256 build/LEIA-ANTES-DE-INSTALAR.txt
          unzip -tq build/ReiAnix-apk.zip
          test -s build/ReiAnix-apk.zip
          unzip -Z1 build/ReiAnix-apk.zip | grep -Fxq 'ReiAnix.apk'
          unzip -Z1 build/ReiAnix-apk.zip | grep -Fxq 'ReiAnix.apk.sha256'
          unzip -Z1 build/ReiAnix-apk.zip | grep -Fxq 'LEIA-ANTES-DE-INSTALAR.txt'
          apk_bytes="$(stat -c '%s' build/ReiAnix.apk)"
          zip_bytes="$(stat -c '%s' build/ReiAnix-apk.zip)"
          printf 'APK_SIZE_BYTES=%s\nZIP_SIZE_BYTES=%s\n' "$apk_bytes" "$zip_bytes"
          test "$zip_bytes" -le "$((apk_bytes + 1048576))"

      - name: Publish APK and ZIP to rolling GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: reianix-ci-latest
        shell: bash
        run: |
          set -euo pipefail
          release_args=(
            --repo "$GITHUB_REPOSITORY"
            --title "ReiAnix CI — latest"
            --notes "Native Kotlin/Compose APK from commit $GITHUB_SHA."
            --latest=false
          )
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" "${release_args[@]}"
            gh release upload "$RELEASE_TAG" \
              build/ReiAnix.apk build/ReiAnix-apk.zip build/ReiAnix.apk.sha256 \
              build/LEIA-ANTES-DE-INSTALAR.txt build/reiflix-release-metadata.txt \
              build/reiflix-build-identity.json --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" \
              build/ReiAnix.apk build/ReiAnix-apk.zip build/ReiAnix.apk.sha256 \
              build/LEIA-ANTES-DE-INSTALAR.txt build/reiflix-release-metadata.txt \
              build/reiflix-build-identity.json "${release_args[@]}" --target "$GITHUB_SHA"
          fi

      - name: Upload APK to Actions run
        uses: actions/upload-artifact@v4
        with:
          name: ReiAnix-apk-instalacao-direta-${{ github.run_number }}
          path: |
            build/ReiAnix.apk
            build/ReiAnix.apk.sha256
            build/LEIA-ANTES-DE-INSTALAR.txt
            build/reiflix-release-metadata.txt
            build/reiflix-build-identity.json
          retention-days: 1
          if-no-files-found: error


      - name: Upload APK ZIP to Actions run
        uses: actions/upload-artifact@v4
        with:
          name: ReiAnix-ZIP-extraia-primeiro-${{ github.run_number }}
          path: build/ReiAnix-apk.zip
          retention-days: 1
          if-no-files-found: error
