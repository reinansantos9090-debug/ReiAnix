name: ReiAnix Auto Repair

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID da execução do GitHub Actions que falhou"
        required: true
        type: string
jobs:
  repair:
    name: Conservative CI repair
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read

    steps:
      - name: Resolve failed run
        id: run
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            run_id="$INPUT_RUN_ID"
          else
            run_id="$EVENT_RUN_ID"
          fi
          case "$run_id" in
            ''|*[!0-9]*)
              echo "Invalid workflow run id: $run_id"
              exit 1
              ;;
          esac
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Inspect failed run metadata
        id: metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$RUNNER_TEMP/run.json"
          cat "$RUNNER_TEMP/run.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path(os.environ["RUNNER_TEMP"], "run.json").read_text())
          if data.get("conclusion") != "failure":
              raise SystemExit(f"Auto repair only accepts failed runs; got {data.get('conclusion')!r}.")
          if data.get("head_branch") != "main":
              raise SystemExit(f"Auto repair only accepts main; got {data.get('head_branch')!r}.")
          repo = data.get("head_repository") or {}
          full_name = repo.get("full_name")
          if full_name != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit(f"Refusing non-origin run repository: {full_name!r}")
          Path(os.environ["GITHUB_OUTPUT"]).write_text(
              "head_sha=" + data["head_sha"] + "\n",
              encoding="utf-8",
              errors="strict",
          )
          PY

      - name: Checkout exact failed main commit
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.metadata.outputs.head_sha }}
          fetch-depth: 0

      - name: Verify failed commit is still current main
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILED_SHA: ${{ steps.metadata.outputs.head_sha }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$current" = "$FAILED_SHA" ]; then
            echo "safe=true" >> "$GITHUB_OUTPUT"
          else
            echo "safe=false" >> "$GITHUB_OUTPUT"
            echo "main moved since the failed run; refusing to patch a newer commit"
            echo "failed=$FAILED_SHA current=$current"
          fi

      - name: Download failed workflow log
        if: ${{ steps.guard.outputs.safe == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
        run: |
          set -euo pipefail
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > "$RUNNER_TEMP/failed.log"
          test -s "$RUNNER_TEMP/failed.log"

      - name: Apply one known repair and validate it
        id: repair
        if: ${{ steps.guard.outputs.safe == 'true' }}
        env:
          FAILED_LOG: ${{ runner.temp }}/failed.log
        run: |
          set -euo pipefail
          result="$(python scripts/reianix_auto_repair.py --log "$FAILED_LOG")"
          printf '%s\n' "$result"
          case "$result" in
            *"REIANIX_AUTO_REPAIR=PASS"*)
              echo "repaired=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "repaired=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Run full Python regression suite after repair
        if: ${{ steps.repair.outputs.repaired == 'true' }}
        run: python -m pytest -q

      - name: Check final diff
        if: ${{ steps.repair.outputs.repaired == 'true' }}
        run: git diff --check

      - name: Commit and push validated repair
        if: ${{ steps.repair.outputs.repaired == 'true' }}
        env:
          FAILED_RUN_ID: ${{ steps.run.outputs.run_id }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No repair was produced."
            exit 1
          fi

          git status --short
          git diff --stat

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/workflows/android_instrumented.yml .github/workflows/build_apk.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No allowlisted changes staged."
            exit 1
          fi

          git commit -m "fix(ci): automatic known issue repair (run $FAILED_RUN_ID)"
          git push origin HEAD:main

      - name: Publish repair summary
        if: always()
        run: |
          {
            echo "## ReiAnix Auto Repair"
            echo
            echo "- Mode: conservative allow-list"
            echo "- Source run: ${{ steps.run.outputs.run_id }}"
            echo "- Only main-origin failures are eligible."
            echo "- Changes are committed only after focused validation and the full Python suite pass."
          } >> "$GITHUB_STEP_SUMMARY"
