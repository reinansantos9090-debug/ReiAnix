name: ReiAnix Release Evidence Certification

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: reianix-release-certification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-sdk-adb-test:
    name: Android SDK and ADB toolchain verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout official repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Initialize Android SDK and ADB diagnostics
        shell: bash
        run: |
          set -euo pipefail
          printf 'ReiAnix Android SDK/ADB certification\nCommit: %s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/android-sdk-adb-certification.log"

      - name: Verify Java availability and version
        shell: bash
        run: |
          set -euo pipefail
          java -version 2>&1 | tee -a "$RUNNER_TEMP/android-sdk-adb-certification.log"
          java_version="$(java -XshowSettings:properties -version 2>&1 | awk -F'= ' '/java.specification.version/ {print $2; exit}')"
          test "$java_version" = "17"
          printf 'java.specification.version=%s\n' "$java_version" | tee -a "$RUNNER_TEMP/android-sdk-adb-certification.log"

      - name: Verify Android SDK path and configuration
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root"
          test -d "$sdk_root"
          if [[ -n "${ANDROID_HOME:-}" && -n "${ANDROID_SDK_ROOT:-}" ]]; then
            test "$(realpath "$ANDROID_HOME")" = "$(realpath "$ANDROID_SDK_ROOT")"
          fi
          {
            printf 'ANDROID_HOME=%s\n' "${ANDROID_HOME:-unset}"
            printf 'ANDROID_SDK_ROOT=%s\n' "${ANDROID_SDK_ROOT:-unset}"
            printf 'Resolved SDK root=%s\n' "$sdk_root"
          } | tee -a "$RUNNER_TEMP/android-sdk-adb-certification.log"

      - name: Verify required Android platform and Build-Tools packages
        shell: bash
        run: |
          set -euo pipefail
          compile_sdk="$(sed -nE 's/^[[:space:]]*compileSdk[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' android/app/build.gradle.kts | head -n 1)"
          build_tools_version="$(grep -oE 'build-tools;[0-9]+\.[0-9]+\.[0-9]+' .github/workflows/release_certification.yml | head -n 1 | cut -d ';' -f 2)"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$compile_sdk"
          test -n "$build_tools_version"
          platform_dir="$sdk_root/platforms/android-$compile_sdk"
          build_tools_dir="$sdk_root/build-tools/$build_tools_version"
          test -s "$platform_dir/android.jar"
          test -s "$build_tools_dir/source.properties"
          grep -Eq "Pkg.Revision[[:space:]]*=[[:space:]]*$build_tools_version([[:space:]]|$)" "$build_tools_dir/source.properties"
          test -x "$build_tools_dir/aapt2"
          test -x "$build_tools_dir/zipalign"
          {
            printf 'compileSdk=%s\n' "$compile_sdk"
            printf 'Android platform path=%s\n' "$platform_dir"
            printf 'Build-Tools version=%s\n' "$build_tools_version"
            grep -E '^Pkg.Revision' "$build_tools_dir/source.properties"
          } | tee -a "$RUNNER_TEMP/android-sdk-adb-certification.log"

      - name: Verify sdkmanager availability
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_path="$(command -v sdkmanager)"
          test -n "$sdkmanager_path"
          printf 'sdkmanager path=%s\n' "$sdkmanager_path" | tee -a "$RUNNER_TEMP/android-sdk-adb-certification.log"
          sdkmanager --version 2>&1 | tee -a "$RUNNER_TEMP/android-sdk-adb-certification.log"

      - name: Verify ADB availability and version
        shell: bash
        run: |
          set -euo pipefail
          adb_path="$(command -v adb)"
          test -n "$adb_path"
          printf 'adb path=%s\n' "$adb_path" | tee -a "$RUNNER_TEMP/android-sdk-adb-certification.log"
          adb --version 2>&1 | tee -a "$RUNNER_TEMP/android-sdk-adb-certification.log"

      - name: Generate Gradle Wrapper for this CI run
        working-directory: android
        run: gradle wrapper --gradle-version 8.11.1 --distribution-type bin

      - name: Verify Gradle Wrapper availability and version
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --version 2>&1 | tee -a "$RUNNER_TEMP/android-sdk-adb-certification.log"
          test -s gradle/wrapper/gradle-wrapper.properties
          grep -Fq 'gradle-8.11.1-bin.zip' gradle/wrapper/gradle-wrapper.properties

      - name: List ADB devices without requiring a connected phone
        shell: bash
        run: |
          set -euo pipefail
          adb devices -l 2>&1 | tee "$RUNNER_TEMP/adb-devices.log" | tee -a "$RUNNER_TEMP/android-sdk-adb-certification.log"
          if ! grep -Eq '^[[:alnum:]_.:-]+[[:space:]]+device([[:space:]]|$)' "$RUNNER_TEMP/adb-devices.log"; then
            echo "No accessible Android device is attached to this runner; tool verification remains valid." | tee -a "$RUNNER_TEMP/android-sdk-adb-certification.log"
          fi

      - name: Upload Android SDK and ADB diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ReiAnix-android-sdk-adb-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/android-sdk-adb-certification.log
            ${{ runner.temp }}/adb-devices.log
          retention-days: 7
          if-no-files-found: warn

  native-certification:
    name: Native Kotlin compilation certification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout official repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Generate temporary Gradle Wrapper for CI
        working-directory: android
        run: gradle wrapper --gradle-version 8.11.1 --distribution-type bin

      - name: Validate native entry point and repository integrity
        shell: bash
        run: |
          set -euo pipefail
          test -s android/settings.gradle.kts
          test -s android/build.gradle.kts
          test -s android/app/build.gradle.kts
          test -s android/app/src/main/AndroidManifest.xml
          test -s android/app/src/main/kotlin/com/reiflix/reiflix_local/MainActivity.kt
          test -s android/app/src/main/kotlin/com/reiflix/reiflix_local/ReiAnixApplication.kt
          test ! -e main.py
          test ! -e app_config.py
          test ! -e requirements.txt
          test ! -e pyproject.toml
          if find . -path './.git' -prune -o -path './build' -prune -o -type f \( -name '*.py' -o -name '*.pyc' \) -print | grep -q .; then
            echo "Unexpected Python source/bytecode remains in the repository."
            exit 1
          fi
          test -n "$(find android/app/src/main/kotlin -type f -name '*.kt' -print -quit)"
          grep -Fq 'android:name=".MainActivity"' android/app/src/main/AndroidManifest.xml
          git diff --check
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Run JVM SQLite regression tests and compile release Kotlin sources
        shell: bash
        env:
          GRADLE_OPTS: "-Dorg.gradle.caching=true -Dorg.gradle.parallel=true -Dorg.gradle.workers.max=2"
        run: |
          set -euo pipefail
          contract="$RUNNER_TEMP/native-sqlite-contract-v29.json"
          fixture="android/app/src/test/resources/native-sqlite-schema-v29.json"
          mkdir -p "$(dirname "$fixture")"
          trap 'rm -f "$fixture"; rmdir "$(dirname "$fixture")" 2>/dev/null || true' EXIT
          gzip -dc android/app/src/main/assets/native-sqlite-contract-v29.json.gz > "$contract"
          jq '. + {statements: ((.table_sql | to_entries | sort_by(.key) | map(.value)) + ([.indexes | sort_by(.name)[] | select(.sql != null) | .sql]))}' "$contract" > "$fixture"
          jq -e '.schema_version == 29 and (.tables | length == 14) and (.statements | length >= 14)' "$fixture" >/dev/null
          ./android/gradlew -p android --no-daemon --console=plain --stacktrace --max-workers=2 \
            -PreianixBuildNumber="$GITHUB_RUN_NUMBER" \
            -PreianixBuildVersion="0.2.1" \
            :app:testDebugUnitTest \
            --tests com.reiflix.reiflix_local.data.sqlite.ReiAnixSqliteRepositoryRuntimeTest.compatibleLegacyColumnsAndIndexesRemainReadableWithoutRebuildingUserTables \
            --tests com.reiflix.reiflix_local.data.sqlite.ReiAnixSqliteRepositoryRuntimeTest.migrationRepairsStaleCanonicalIndexDefinitionWithoutRebuildingCatalogTables \
            --tests com.reiflix.reiflix_local.data.sqlite.ReiAnixSqliteRepositoryRuntimeTest.readsPreexistingCatalogAndReportsVersionWithoutChangingSchema \
            --tests com.reiflix.reiflix_local.data.sqlite.ReiAnixSqliteRepositoryRuntimeTest.applicationRepositoryRejectsAnIncompatibleSchemaBeforeServingRows \
            --tests com.reiflix.reiflix_local.data.sqlite.ReiAnixSqliteRepositoryRuntimeTest.initializationCreatesFreshCanonicalDatabaseOnlyAfterExplicitAuthorization \
            --tests com.reiflix.reiflix_local.data.sqlite.ReiAnixSqliteRepositoryRuntimeTest.initializationIsIdempotentAndPreservesExistingCanonicalCatalogData \
            --tests com.reiflix.reiflix_local.data.sqlite.ReiAnixSqliteRepositoryRuntimeTest.initializationRejectsMissingCoreTablesWithoutRecreatingThemOrReplacingTheCatalog \
            --tests com.reiflix.reiflix_local.data.sqlite.ReiAnixSqliteRepositoryRuntimeTest.initializationRejectsCorruptExistingDatabaseWithoutReplacingItsBytes \
            --tests com.reiflix.reiflix_local.data.sqlite.ReiAnixSqliteRepositoryRuntimeTest.initializationRejectsEmptyExistingDatabaseWithoutReplacingIt \
            --tests com.reiflix.reiflix_local.data.sqlite.ReiAnixSqliteRepositoryRuntimeTest.initializationDoesNotOverwriteAnUnexpectedSqliteUserVersion \
            --tests com.reiflix.reiflix_local.data.sqlite.ReiAnixSqliteRepositoryRuntimeTest.bootstrapKeepsNativeServicesGatedWhenCanonicalCoreTablesAreMissing \
            --tests com.reiflix.reiflix_local.data.sqlite.ReiAnixSqliteRepositoryRuntimeTest.artworkDiscoveryAttemptTimestampsPersistInCanonicalPreferencesAcrossDatabaseInstances \
            --tests com.reiflix.reiflix_local.data.sqlite.ReiAnixSqliteRepositoryRuntimeTest.startupSettingsInitializationSeedsMissingDefaultsAndRepairsOnlyInvalidKnownValues \
            --tests com.reiflix.reiflix_local.ReiAnixSettingsContractTest.effectiveSettingsApplyDefaultsPreserveValidChoicesAndReplaceOnlyInvalidValues \
            --tests com.reiflix.reiflix_local.VideoThumbnailExtractorTest \
            --tests com.reiflix.reiflix_local.storage.VideoThumbnailFileValidationTest \
            --tests com.reiflix.reiflix_local.ui.artwork.ReiAnixLocalArtworkTest \
            --tests com.reiflix.reiflix_local.data.artwork.ReiAnixArtworkPublicationSignalTest \
            --tests com.reiflix.reiflix_local.data.anilist.ReiAnixAniListMatcherTest \
            --tests com.reiflix.reiflix_local.LibraryUiMappersTest.realDurationAndEpisodeArtworkReachUiModelUnchanged \
            --tests com.reiflix.reiflix_local.ui.model.ReiAnixDetailsUiStateProjectionTest \
            2>&1 | tee "$RUNNER_TEMP/reianix-jvm-certification.log"

      - name: Compile release Kotlin and assemble release APK
        if: always() && !cancelled()
        shell: bash
        env:
          GRADLE_OPTS: "-Dorg.gradle.caching=true -Dorg.gradle.parallel=true -Dorg.gradle.workers.max=2"
        run: |
          set -euo pipefail
          ./android/gradlew -p android --no-daemon --console=plain --stacktrace --max-workers=2 \
            -PreianixBuildNumber="$GITHUB_RUN_NUMBER" \
            -PreianixBuildVersion="0.2.1" \
            :app:compileReleaseKotlin \
            :app:assembleRelease 2>&1 | tee -a "$RUNNER_TEMP/reianix-jvm-certification.log"

      - name: Upload JVM certification log and release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ReiAnix-release-certification-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/reianix-jvm-certification.log
            android/app/build/test-results/testDebugUnitTest/*.xml
            android/app/build/reports/tests/testDebugUnitTest/**
            android/app/build/outputs/apk/release/*.apk
          retention-days: 7
          if-no-files-found: warn
