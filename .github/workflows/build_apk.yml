name: Build ReiAnix Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build native Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configure Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;36.0.0 platforms;android-36'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Validate Gradle wrapper and source revision
        shell: bash
        run: |
          set -euo pipefail
          test -s gradlew
          test -s gradle/wrapper/gradle-wrapper.jar
          test -s gradle/wrapper/gradle-wrapper.properties
          test -s settings.gradle.kts
          test -s android/app/build.gradle.kts
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          chmod +x gradlew
          echo "ORG_GRADLE_PROJECT_reianixVersionCode=$((2000000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          ./gradlew --version

      - name: Configure release signing
        shell: bash
        env:
          REIFLIX_ANDROID_KEYSTORE_B64: ${{ secrets.REIFLIX_ANDROID_KEYSTORE_B64 }}
          REIFLIX_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.REIFLIX_ANDROID_KEYSTORE_PASSWORD }}
          REIFLIX_ANDROID_KEY_PASSWORD: ${{ secrets.REIFLIX_ANDROID_KEY_PASSWORD }}
          REIFLIX_ANDROID_KEY_ALIAS: ${{ secrets.REIFLIX_ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -n "${REIFLIX_ANDROID_KEYSTORE_B64:-}" && -n "${REIFLIX_ANDROID_KEYSTORE_PASSWORD:-}" && -n "${REIFLIX_ANDROID_KEY_PASSWORD:-}" && -n "${REIFLIX_ANDROID_KEY_ALIAS:-}" ]]; then
            mkdir -p "$GITHUB_WORKSPACE/build"
            printf "%s" "$REIFLIX_ANDROID_KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/build/reiflix-release.jks"
            test -s "$GITHUB_WORKSPACE/build/reiflix-release.jks"
            {
              echo "REIFLIX_ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/build/reiflix-release.jks"
              echo "REIFLIX_ANDROID_KEYSTORE_PASSWORD=$REIFLIX_ANDROID_KEYSTORE_PASSWORD"
              echo "REIFLIX_ANDROID_KEY_PASSWORD=$REIFLIX_ANDROID_KEY_PASSWORD"
              echo "REIFLIX_ANDROID_KEY_ALIAS=$REIFLIX_ANDROID_KEY_ALIAS"
              echo "REIANIX_SIGNING_MODE=stable"
            } >> "$GITHUB_ENV"
            echo "Stable Android release signing configured."
          else
            echo "REIANIX_SIGNING_MODE=debug-fallback" >> "$GITHUB_ENV"
            echo "::warning::Stable signing secrets are missing. This APK will not update an install signed with a different key."
          fi

      - name: Validate optional public Google Web client ID
        shell: bash
        env:
          REIFLIX_GOOGLE_WEB_CLIENT_ID: ${{ vars.REIFLIX_GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -euo pipefail
          client_id="${REIFLIX_GOOGLE_WEB_CLIENT_ID:-}"
          if [[ -n "$client_id" ]]; then
            if [[ ! "$client_id" =~ ^[A-Za-z0-9._-]+\.apps\.googleusercontent\.com$ ]]; then
              echo "::error::REIFLIX_GOOGLE_WEB_CLIENT_ID has an invalid public OAuth client ID format."
              exit 1
            fi
          else
            echo "::warning::Google login will show configuration required until the public Web client ID is configured."
          fi
          echo "REIFLIX_GOOGLE_WEB_CLIENT_ID=$client_id" >> "$GITHUB_ENV"

      - name: Build native release APK without Python, Flet, or Flutter
        shell: bash
        env:
          GRADLE_OPTS: "-Dorg.gradle.parallel=false -Dorg.gradle.workers.max=2"
        run: |
          set -euo pipefail
          ./gradlew :app:clean --no-daemon --stacktrace --max-workers=2
          ./gradlew :app:assembleRelease --no-daemon --stacktrace --max-workers=2
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Verify APK payload, manifest, schema, and native entry points
        shell: bash
        run: |
          set -euo pipefail
          source_apk="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$source_apk"
          unzip -tq "$source_apk"
          apk_entries="$(unzip -Z1 "$source_apk")"
          legacy_payload_pattern='(^|/)assets/app\.zip$|^assets/flutter_assets/|^lib/[^/]+/lib(app|[^/]*(flutter|python)[^/]*)\.so$|(^|/)[^/]+\.py[co]?$'
          if grep -Eiq "$legacy_payload_pattern" <<< "$apk_entries"; then
            echo "::error::The official APK contains a legacy Python/Flet/Flutter runtime payload."
            grep -Ei "$legacy_payload_pattern" <<< "$apk_entries"
            exit 1
          fi

          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          test -x "$build_tools/aapt"
          test -x "$build_tools/apksigner"
          mkdir -p build/native-release
          "$build_tools/aapt" dump badging "$source_apk" > build/native-release/apk-badging.txt
          "$build_tools/aapt" dump xmltree "$source_apk" AndroidManifest.xml > build/native-release/effective-manifest.txt
          grep -F "package: name='com.reiflix.reiflix_local'" build/native-release/apk-badging.txt
          grep -F "versionCode='$(printf '%s' "$ORG_GRADLE_PROJECT_reianixVersionCode")'" build/native-release/apk-badging.txt
          grep -F "targetSdkVersion:'36'" build/native-release/apk-badging.txt
          grep -F "versionName='0.2.1'" build/native-release/apk-badging.txt
          grep -F 'com.reiflix.reiflix_local.MainActivity' build/native-release/effective-manifest.txt
          grep -F 'com.reiflix.reiflix_local.NativePlayerActivity' build/native-release/effective-manifest.txt
          if grep -Eiq 'io\.flutter\.embedding|Flutter(Activity|FragmentActivity)|com\.flet' build/native-release/effective-manifest.txt; then
            echo "::error::The official APK manifest still references a Flutter/Flet host."
            exit 1
          fi

          unzip -Z1 "$source_apk" | grep -Fx 'assets/native-sqlite-contract-v29.json'
          unzip -Z1 "$source_apk" | grep -Fx 'assets/native-sqlite-bootstrap-v29.json'
          unzip -Z1 "$source_apk" | grep -Eq '^classes([0-9]+)?\.dex$'
          while IFS= read -r dex; do unzip -p "$source_apk" "$dex"; done < <(unzip -Z1 "$source_apk" | grep -E '^classes([0-9]+)?\.dex$') | strings > build/native-release/dex-strings.txt
          grep -F 'Lcom/reiflix/reiflix_local/MainActivity;' build/native-release/dex-strings.txt
          grep -F 'Lcom/reiflix/reiflix_local/ui/host/ReiAnixComposeLibraryHost;' build/native-release/dex-strings.txt
          grep -F 'Lcom/reiflix/reiflix_local/NativePlayerActivity;' build/native-release/dex-strings.txt
          "$build_tools/apksigner" verify --verbose --print-certs "$source_apk" | tee build/native-release/signing-certificate.txt

      - name: Create direct APK, install guide, ZIP, and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reianix-release
          cp android/app/build/outputs/apk/release/app-release.apk build/reianix-release/ReiAnix.apk
          test -s build/reianix-release/ReiAnix.apk
          (
            cd build/reianix-release
            sha256sum ReiAnix.apk > ReiAnix.apk.sha256
          )
          cat > build/reianix-release/LEIA-ANTES-DE-INSTALAR.txt <<'EOF'
          REIANIX — COMO INSTALAR NO ANDROID

          1. Toque diretamente em ReiAnix.apk para instalar.
          2. Se o Android bloquear, permita “Instalar apps desconhecidos” para o gerenciador de arquivos e tente novamente.
          3. O arquivo ReiAnix.apk.sha256 serve apenas para verificar a integridade; não instale nem extraia esse arquivo.
          4. Se o Android recusar uma atualização, verifique se o APK foi assinado com a mesma chave da instalação atual.
          EOF
          {
            printf '{\n'
            printf '  "app": "ReiAnix",\n'
            printf '  "applicationId": "com.reiflix.reiflix_local",\n'
            printf '  "variant": "release",\n'
            printf '  "versionCode": %s,\n' "$ORG_GRADLE_PROJECT_reianixVersionCode"
            printf '  "versionName": "0.2.1",\n'
            printf '  "commit": "%s",\n' "$GITHUB_SHA"
            printf '  "artifactPurpose": "native-production-apk",\n'
            printf '  "pythonRuntimePackaged": false,\n'
            printf '  "fletRuntimePackaged": false,\n'
            printf '  "flutterRuntimePackaged": false,\n'
            printf '  "runtimeIndependenceCertified": false,\n'
            printf '  "signingMode": "%s"\n' "${REIANIX_SIGNING_MODE:-unknown}"
            printf '}\n'
          } > build/reianix-release/distribution-manifest.json
          (
            cd build/reianix-release
            zip -j -9 -X ReiAnix-apk.zip ReiAnix.apk ReiAnix.apk.sha256 LEIA-ANTES-DE-INSTALAR.txt distribution-manifest.json
            unzip -tq ReiAnix-apk.zip
            mkdir -p zip-check
            unzip -q -o ReiAnix-apk.zip -d zip-check
            cmp -s ReiAnix.apk zip-check/ReiAnix.apk
            (cd zip-check && sha256sum -c ReiAnix.apk.sha256)
            rm -rf zip-check
          )
          sha256sum build/reianix-release/ReiAnix.apk
          sha256sum build/reianix-release/ReiAnix-apk.zip
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Upload APK artifact
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ReiAnix-apk-instalacao-direta-${{ github.run_number }}
          path: |
            build/reianix-release/ReiAnix.apk
            build/reianix-release/ReiAnix.apk.sha256
            build/reianix-release/LEIA-ANTES-DE-INSTALAR.txt
            build/reianix-release/distribution-manifest.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload ZIP artifact
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ReiAnix-ZIP-extraia-primeiro-${{ github.run_number }}
          path: build/reianix-release/ReiAnix-apk.zip
          if-no-files-found: error
          retention-days: 1

      - name: Publish APK and ZIP to rolling GitHub Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: reianix-ci-latest
        shell: bash
        run: |
          set -euo pipefail
          release_args=(--repo "$GITHUB_REPOSITORY" --title "ReiAnix CI — latest" --notes "Native Android APK from commit $GITHUB_SHA." --latest=false)
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" "${release_args[@]}"
            gh release upload "$RELEASE_TAG" build/reianix-release/ReiAnix.apk build/reianix-release/ReiAnix-apk.zip build/reianix-release/ReiAnix.apk.sha256 build/reianix-release/LEIA-ANTES-DE-INSTALAR.txt build/reianix-release/distribution-manifest.json --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" build/reianix-release/ReiAnix.apk build/reianix-release/ReiAnix-apk.zip build/reianix-release/ReiAnix.apk.sha256 build/reianix-release/LEIA-ANTES-DE-INSTALAR.txt build/reianix-release/distribution-manifest.json "${release_args[@]}" --target "$GITHUB_SHA"
          fi
