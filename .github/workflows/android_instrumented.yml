name: ReiAnix Android Instrumented Runtime Matrix

on:
  workflow_dispatch:

concurrency:
  # Device/emulator certification is intentionally manual and single-instance.
  group: reiflix-android-instrumented-manual
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  python-contracts:
    name: Python contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "flet[cli]==0.86.5" pytest
      - name: Compile Python sources
        run: python -m compileall -q main.py app_config.py core views scripts
      - name: Run full Python tests
        run: |
          python -m pytest -q
          python -m unittest discover -s tests -p 'test*.py' -t .
      - name: Check diff whitespace
        run: git diff --check

  prepare-android-test-project:
    name: Render Android test project
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true
      - name: Accept Android SDK licenses and install platform
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager_path="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$sdkmanager_path"
          set +o pipefail
          yes | "$sdkmanager_path" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager_path" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "emulator"
      - name: Install Flet build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "flet[cli]==0.86.5"
      - name: Generate deterministic player fixture
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/create_player_fixture.py
          test -s android/app/src/androidTest/assets/player_fixture.mp4
          python scripts/create_library_fixture_fixture.py
          test -s android/app/src/androidTest/assets/library_fixture.sqlite3
      - name: Prepare Flet template with ReiAnix Android host
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          curl -sSL -o build/flet-build-template.zip https://github.com/flet-dev/flet/releases/download/v0.86.5/flet-build-template.zip
          mkdir -p build/temp_tmpl build/flet-build-template
          unzip -q build/flet-build-template.zip -d build/temp_tmpl
          cp -a build/temp_tmpl/build/. build/flet-build-template/
          rm -rf build/temp_tmpl build/flet-build-template.zip
          python scripts/prepare_flet_template.py             --template "$GITHUB_WORKSPACE/build/flet-build-template"             --overlay "$GITHUB_WORKSPACE/android"
      - name: Render Android Gradle project
        shell: bash
        run: |
          set -euo pipefail
          git_backup_root="$(mktemp -d)"
          git_backup="$git_backup_root/.git"
          mv .git "$git_backup"
          restore_git() {
            if [ -d "$git_backup" ] && [ ! -e .git ]; then
              mv "$git_backup" .git
            fi
            rmdir "$git_backup_root"
          }
          trap restore_git EXIT
          flet build apk             --template build/flet-build-template             --build-number "$GITHUB_RUN_NUMBER"             --build-version "0.2.1"             --python-version "3.12"             --yes
      - name: Verify rendered Android test project
        run: |
          test -f build/flutter/android/gradlew
          test -f build/flutter/android/app/build.gradle.kts
          for test_file in \
            NativePlayerPlaybackInstrumentedTest.kt \
            BackAndSettingsReturnInstrumentedTest.kt \
            DeviceFlowInstrumentedTest.kt \
            NativeIndexInstrumentedTest.kt \
            NativeMailboxInstrumentedTest.kt \
            MetadataOwnerInstrumentedTest.kt; do
            test -f "build/flutter/android/app/src/androidTest/kotlin/com/reiflix/reiflix_local/$test_file"
          done
      # Cache the entire rendered Flutter project. Gradle's Flutter task
      # resolves pubspec.yaml from the Flutter project root; restoring only
      # build/flutter/android makes connected tests fail with no pubspec.
      - name: Run Kotlin unit tests
        working-directory: build/flutter/android
        shell: bash
        env:
          SERIOUS_PYTHON_SITE_PACKAGES: ${{ github.workspace }}/build/site-packages
        run: |
          set -euo pipefail
          test -d "$SERIOUS_PYTHON_SITE_PACKAGES"
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Verify rendered Android project integrity
        shell: bash
        run: |
          set -euo pipefail
          test -f build/flutter/pubspec.yaml
          test -f build/flutter/android/gradlew
          test -f build/flutter/android/settings.gradle.kts
          test -f build/flutter/android/app/build.gradle.kts
          test -d build/flutter/android/app/src/androidTest
      - name: Cache rendered Android test project
        uses: actions/cache/save@v4
        with:
          path: |
            build/flutter
            build/site-packages
          key: reianix-android-test-project-v4-${{ github.sha }}


  instrumented:
    name: Android API 36
    needs: prepare-android-test-project
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true
      - name: Verify Flutter SDK
        run: |
          set -euo pipefail
          flutter --version
          test -d "$FLUTTER_ROOT/packages/flutter_tools/gradle"
      - name: Accept Android SDK licenses and install emulator dependencies
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager_path="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$sdkmanager_path"
          set +o pipefail
          yes | "$sdkmanager_path" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager_path" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "emulator"
      - name: Restore rendered Android test project
        uses: actions/cache/restore@v4
        with:
          path: |
            build/flutter
            build/site-packages
          key: reianix-android-test-project-v4-${{ github.sha }}
      - name: Restore Flutter pub dependencies
        working-directory: build/flutter
        run: flutter pub get
      - name: Verify restored Android test project
        shell: bash
        run: |
          set -euo pipefail
          test -f build/flutter/android/gradlew
          test -f build/flutter/android/settings.gradle.kts
          test -f build/flutter/android/app/build.gradle.kts
          test -d build/flutter/android/app/src/androidTest
          chmod +x build/flutter/android/gradlew
      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-reianix-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
          ls -l /dev/kvm
      - name: Run instrumented tests on Android API 36
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-boot-timeout: 1200
          disable-animations: false
          disable-linux-hw-accel: false
          emulator-options: "-no-window -no-audio -no-boot-anim -no-snapshot -no-snapshot-save -gpu swiftshader_indirect -camera-back none -camera-front none"
          script: bash "$GITHUB_WORKSPACE/scripts/run_android_instrumented.sh" "36" "$GITHUB_WORKSPACE/build/android-api36"
      - name: Summarize instrumented test failures
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/build/flutter/android"
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          roots = [
              Path("app/build/outputs/androidTest-results"),
              Path("app/build/outputs/androidTest-results/connected"),
              Path("app/build/test-results"),
              Path("app/build/outputs"),
          ]
          xml_files = []
          seen = set()
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob("*.xml"):
                  if path in seen:
                      continue
                  seen.add(path)
                  xml_files.append(path)

          failures = []
          for path in xml_files:
              try:
                  root = ET.parse(path).getroot()
              except (ET.ParseError, OSError):
                  continue
              for testcase in root.iter("testcase"):
                  error_nodes = [child for child in testcase if child.tag.rsplit("}", 1)[-1] in {"failure", "error"}]
                  if not error_nodes:
                      continue
                  classname = testcase.attrib.get("classname", "")
                  name = testcase.attrib.get("name", "")
                  detail = ""
                  if error_nodes:
                      detail = " ".join((error_nodes[0].text or "").split())[:1200]
                  failures.append((classname, name, detail, str(path)))

          print(f"INSTRUMENTED_RESULT_FILES={len(xml_files)}")
          if not failures:
              print("INSTRUMENTED_FAILURES=0")
          else:
              print(f"INSTRUMENTED_FAILURES={len(failures)}")
              for classname, name, detail, path in failures:
                  print(f"INSTRUMENTED_TEST_FAILURE={classname}#{name}")
                  if detail:
                      print(f"INSTRUMENTED_TEST_FAILURE_DETAIL={detail}")
                  print(f"INSTRUMENTED_TEST_RESULT_FILE={path}")
          PY

          log="$(find "$GITHUB_WORKSPACE/build" -type f -name 'connectedDebugAndroidTest.log' -print -quit)"
          if [ -n "$log" ]; then
            echo "===== CONNECTED_TEST_LOG_FAILURE_CONTEXT ====="
            set +e
            grep -n -E 'FAILED|FAILURE|There were failing tests|Test run failed|Exception|AssertionError' "$log" | tail -n 120
            grep_status=${PIPESTATUS[0]}
            set -e
            if [ "$grep_status" -gt 1 ]; then
              echo "INSTRUMENTED_TEST_LOG_GREP_FAILED=$grep_status"
              exit "$grep_status"
            fi
          else
            echo "INSTRUMENTED_TEST_LOG=NOT_FOUND"
          fi

      - name: Capture Android runtime diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          out="$GITHUB_WORKSPACE/build/android-api36"
          mkdir -p "$out"

          # Diagnostic collection must never hide or change the preceding
          # instrumentation result. Each individual adb command is bounded so
          # a wedged emulator cannot prevent the evidence directory from being
          # uploaded after a real test failure.
          capture() {
            local output="$1"
            shift
            timeout --signal=TERM --kill-after=5s 30s "$@" >"$output" 2>&1
            local status=$?
            if [ "$status" -ne 0 ]; then
              printf '\nCOMMAND_EXIT=%s\n' "$status" >>"$output"
            fi
            return 0
          }

          capture "$out/adb_devices.txt" adb devices -l
          capture "$out/sdk.txt" adb shell getprop ro.build.version.sdk
          capture "$out/activity_top.txt" adb shell dumpsys activity top
          capture "$out/window.txt" adb shell dumpsys window
          capture "$out/package.txt" adb shell dumpsys package com.reiflix.reiflix_local
          capture "$out/logcat.txt" adb logcat -d -b all -v threadtime
          capture "$out/screenshot.png" adb exec-out screencap -p
          capture "$out/ui_dump.txt" adb shell uiautomator dump /sdcard/window.xml
          capture "$out/ui.xml" adb shell cat /sdcard/window.xml
          {
            echo "## Android runtime diagnostics"
            echo "SDK:"
            if [ -f "$out/sdk.txt" ]; then
              cat "$out/sdk.txt"
            fi
            echo "--- adb devices ---"
            if [ -f "$out/adb_devices.txt" ]; then
              cat "$out/adb_devices.txt"
            fi
            echo "--- command exit markers ---"
            grep -h "COMMAND_EXIT=" "$out"/*.txt || true
          } >> "$GITHUB_STEP_SUMMARY"
          set -e

      - name: Analyze ReiAnix runtime Logcat
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          log="$GITHUB_WORKSPACE/build/android-api36/logcat.txt"
          report="$GITHUB_WORKSPACE/build/android-api36/reianix-logcat-analysis.json"
          python scripts/analyze_android_runtime_log.py \
            --logcat "$log" \
            --output "$report" \
            --package "com.reiflix.reiflix_local"

      - name: Upload Android instrumentation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ReiAnix-android-api36-diagnostics-${{ github.run_number }}
          path: |
            build/android-api36/**
            build/flutter/android/app/build/reports/**
            build/flutter/android/app/build/test-results/**
            build/flutter/android/app/build/outputs/androidTest-results/**
          retention-days: 7
          if-no-files-found: warn
