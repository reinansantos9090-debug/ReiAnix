name: ReiAnix Kotlin/JVM Tests

on:
  workflow_dispatch:

concurrency:
  group: reianix-kotlin-jvm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kotlin-jvm:
    name: AniList Kotlin/JVM regression tests (no emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;36.0.0 platforms;android-36"
          accept-android-sdk-licenses: true

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Validate native source layout
        shell: bash
        run: |
          set -euo pipefail
          test -s android/settings.gradle.kts
          test -s android/build.gradle.kts
          test -s android/app/build.gradle.kts
          test -s android/app/src/main/AndroidManifest.xml
          test -s android/app/src/main/kotlin/com/reiflix/reiflix_local/MainActivity.kt
          test -s android/app/src/main/kotlin/com/reiflix/reiflix_local/ReiAnixApplication.kt
          test ! -e main.py
          git diff --check
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Generate temporary Gradle Wrapper for this CI run
        working-directory: android
        run: gradle wrapper --gradle-version 8.11.1 --distribution-type bin

      - name: Verify Gradle Wrapper version
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --version
          test -s gradle/wrapper/gradle-wrapper.properties
          grep -Fq 'gradle-8.11.1-bin.zip' gradle/wrapper/gradle-wrapper.properties

      - name: Prepare canonical SQLite v29 JVM test fixture
        shell: bash
        run: |
          set -euo pipefail
          contract="$RUNNER_TEMP/native-sqlite-contract-v29.json"
          fixture="android/app/src/test/resources/native-sqlite-schema-v29.json"
          mkdir -p "$(dirname "$fixture")"
          gzip -dc android/app/src/main/assets/native-sqlite-contract-v29.json.gz > "$contract"
          jq '. + {statements: ((.table_sql | to_entries | sort_by(.key) | map(.value)) + ([.indexes | sort_by(.name)[] | select(.sql != null) | .sql]))}' "$contract" > "$fixture"
          jq -e '.schema_version == 29 and (.tables | length == 14) and (.statements | length >= 14)' "$fixture" >/dev/null
          test -s "$fixture"
          echo "Prepared canonical SQLite v29 fixture with 14 tables."

      - name: Run AniList and external catalog Kotlin/JVM regression suites
        shell: bash
        env:
          GRADLE_OPTS: "-Dorg.gradle.caching=true -Dorg.gradle.parallel=true -Dorg.gradle.workers.max=2"
        run: |
          set -euo pipefail
          ./android/gradlew -p android --no-daemon --console=plain --stacktrace --max-workers=2 \
            -PreianixBuildNumber="$GITHUB_RUN_NUMBER" \
            -PreianixBuildVersion="0.2.1" \
            :app:testDebugUnitTest \
            --tests com.reiflix.reiflix_local.data.anilist.AniListGraphqlRequestControllerTest \
            --tests com.reiflix.reiflix_local.data.anilist.ReiAnixAniListClientTest \
            --tests com.reiflix.reiflix_local.data.anilist.ReiAnixAniListCatalogProviderAdapterTest \
            --tests com.reiflix.reiflix_local.data.catalog.ReiAnixExternalCatalogContractsTest \
            --tests com.reiflix.reiflix_local.data.catalog.ReiAnixExternalRequestCoordinatorTest \
            --tests com.reiflix.reiflix_local.data.catalog.ReiAnixKitsuCatalogProviderTest \
            --tests com.reiflix.reiflix_local.data.catalog.ReiAnixJikanCatalogProviderTest \
            --tests com.reiflix.reiflix_local.data.sqlite.ReiAnixSqliteRepositoryRuntimeTest.verifiedExternalCatalogIdsPersistInV29PreferencesWithoutChangingLibraryRows \
            --tests com.reiflix.reiflix_local.data.sqlite.ReiAnixSqliteRepositoryRuntimeTest.supplementalKitsuMetadataFillsOnlyGapsAndPersistsItsIdInV29Preferences \
            --tests com.reiflix.reiflix_local.data.sqlite.ReiAnixSqliteRepositoryRuntimeTest.failedKitsuProviderDoesNotBlockVerifiedJikanFallback \
            --tests com.reiflix.reiflix_local.data.sqlite.ReiAnixSqliteRepositoryRuntimeTest.ambiguousJikanCandidatesAreRejectedWithoutPersistingAnyExternalId \
            --tests com.reiflix.reiflix_local.data.sqlite.ReiAnixSqliteRepositoryRuntimeTest.externalArtworkCandidateCannotReplaceManualOrValidLocalPoster \
            2>&1 | tee "$RUNNER_TEMP/reianix-anilist-jvm-tests.log"

      - name: Compile release Kotlin sources
        if: always() && !cancelled()
        shell: bash
        env:
          GRADLE_OPTS: "-Dorg.gradle.caching=true -Dorg.gradle.parallel=true -Dorg.gradle.workers.max=2"
        run: |
          set -euo pipefail
          ./android/gradlew -p android --no-daemon --console=plain --stacktrace --max-workers=2 \
            -PreianixBuildNumber="$GITHUB_RUN_NUMBER" \
            -PreianixBuildVersion="0.2.1" \
            :app:compileReleaseKotlin \
            2>&1 | tee -a "$RUNNER_TEMP/reianix-anilist-jvm-tests.log"

      - name: Publish JVM test summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          reports=(android/app/build/test-results/testDebugUnitTest/TEST-*.xml)
          if [[ ! -e "${reports[0]}" ]]; then
            {
              echo "## AniList and external catalog Kotlin/JVM test results"
              echo
              echo "No JUnit XML reports were produced. Inspect the Gradle test log and uploaded artifacts."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          read -r total failures errors skipped < <(
            awk '
              {
                line=$0
                if (line ~ /<testsuite[[:space:]]/) {
                  tests=fail=err=skip=0
                  if (match(line, /tests="[0-9]+"/)) { value=substr(line, RSTART+7, RLENGTH-8); tests=value+0 }
                  if (match(line, /failures="[0-9]+"/)) { value=substr(line, RSTART+10, RLENGTH-11); fail=value+0 }
                  if (match(line, /errors="[0-9]+"/)) { value=substr(line, RSTART+8, RLENGTH-9); err=value+0 }
                  if (match(line, /skipped="[0-9]+"/)) { value=substr(line, RSTART+9, RLENGTH-10); skip=value+0 }
                  total+=tests; failures+=fail; errors+=err; skipped+=skip
                }
              }
              END { printf "%d %d %d %d\n", total, failures, errors, skipped }
            ' "${reports[@]}"
          )
          passed=$((total - failures - errors - skipped))
          {
            echo "## AniList and external catalog Kotlin/JVM test results"
            echo
            echo "**Totals:** $passed passed, $((failures + errors)) failed, $skipped skipped ($total total)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary SQLite v29 JVM test fixture
        if: always()
        shell: bash
        run: |
          rm -f android/app/src/test/resources/native-sqlite-schema-v29.json
          rmdir android/app/src/test/resources 2>/dev/null || true

      - name: Upload AniList JVM test reports and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ReiAnix-anilist-jvm-test-reports-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/reianix-anilist-jvm-tests.log
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
          if-no-files-found: warn
